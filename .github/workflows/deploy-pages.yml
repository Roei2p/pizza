name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pizza-ordering-system-isahmp
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:gh-pages
      - name: Debug built output (temporary)
        run: |
          echo "=== bun/vite versions ==="
          bun --version
          bunx vite --version || true
          echo "=== dist listing ==="
          ls -la dist
          ls -la dist/assets | head -20
          echo "=== dist/index.html full content ==="
          cat dist/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live response (debugging aid)
        run: |
          echo "Deployed page_url: ${{ steps.deployment.outputs.page_url }}"
          sleep 10
          echo "=== HEAD/body https://roei2p.github.io/pizza/ ==="
          curl -sS -D - -o /tmp/root.html "https://roei2p.github.io/pizza/?ci-verify=$(date +%s)"
          echo "=== First 2000 bytes of body ==="
          head -c 2000 /tmp/root.html
          echo ""
          echo "=== module script tag found in body ==="
          grep -oE '<script[^>]*type="module"[^>]*>' /tmp/root.html || echo "NONE FOUND"
