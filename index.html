<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>הפיצה של שרון | תפריט והזמנות אונליין</title>
    <meta name="description" content="הזמנת פיצות בוטיק חמות מהתנור, שתייה קרה וקינוחים אצל שרון. התאמת תוספות לפי משולשים ורבעים." />
    <meta property="og:title" content="הפיצה של שרון | תפריט והזמנות אונליין" />
    <meta property="og:description" content="הזמנת פיצות בוטיק חמות מהתנור, שתייה קרה וקינוחים אצל שרון. התאמת תוספות לפי משולשים ורבעים." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://roei2p.github.io/pizza/assets/hero-pizza-poster-v2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://roei2p.github.io/pizza/assets/hero-pizza-poster-v2.jpg" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <script>
      // Diagnostic-only, dependency-free classic script (never a module),
      // so it runs even if the main app script fails to load or parse.
      // If #root is still empty a few seconds after load, show whatever
      // error we caught directly on-screen instead of leaving a blank
      // page — this is the only way to see errors on a phone with no
      // devtools attached.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          errors.push((e.message || 'Unknown error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
          errors.push('Unhandled promise rejection: ' + reason);
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || !root.firstChild) {
            var box = document.createElement('div');
            box.style.cssText =
              'font-family:sans-serif;direction:rtl;padding:24px;max-width:600px;' +
              'margin:40px auto;background:#fff3f3;border:2px solid #dc2626;' +
              'border-radius:12px;color:#111;line-height:1.6;';
            box.innerHTML =
              '<h2 style="margin:0 0 12px;color:#dc2626;">האתר לא נטען כראוי</h2>' +
              '<p>צילום מסך של ההודעה הזו יעזור לאתר את הבעיה:</p>' +
              '<pre style="white-space:pre-wrap;background:#fff;padding:12px;border-radius:8px;font-size:12px;direction:ltr;text-align:left;">' +
              (errors.length ? errors.join('\n').replace(/</g, '&lt;') : 'No JS errors captured — the app script itself may not have loaded.') +
              '</pre>' +
              '<p style="font-size:12px;color:#555;">User agent: ' + navigator.userAgent.replace(/</g, '&lt;') + '</p>';
            document.body.appendChild(box);
          }
        }, 4000);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-['Rubik',sans-serif] antialiased selection:bg-red-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
