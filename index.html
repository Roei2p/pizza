<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>הפיצה של שרון | תפריט והזמנות אונליין</title>

    <script>
      // Diagnostic-only, dependency-free classic script (never a module),
      // deliberately the very first thing in <head> — before any external
      // resource (fonts, icons, the app bundle). A render-blocking
      // <link rel="stylesheet"> placed earlier can stall a later <script>
      // tag's execution until that stylesheet resolves; if the font host
      // is slow or unreachable on a given network, that would silently
      // block this diagnostic too. Being first avoids that entirely, so
      // it always runs and can show whatever we caught directly on-screen
      // instead of leaving a blank page — the only way to see errors on a
      // phone with no devtools attached.
      //
      // useCapture:true matters here: a <script>/<link> resource load
      // failure (404, network error, wrong MIME) dispatches a non-
      // bubbling 'error' event on that element, which a normal (bubble
      // phase) window listener never sees. Capture phase does see it.
      (function () {
        var errors = [];
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target !== window && e.target.tagName) {
              var el = e.target;
              errors.push('Resource failed to load: <' + el.tagName.toLowerCase() + '> ' + (el.src || el.href || ''));
            } else {
              errors.push((e.message || 'Unknown error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
          errors.push('Unhandled promise rejection: ' + reason);
        });

        function showFallback(extra) {
          var root = document.getElementById('root');
          if (root && root.firstChild) return;
          var box = document.createElement('div');
          box.style.cssText =
            'font-family:sans-serif;direction:rtl;padding:24px;max-width:600px;' +
            'margin:40px auto;background:#fff3f3;border:2px solid #dc2626;' +
            'border-radius:12px;color:#111;line-height:1.6;';
          var lines = errors.slice();
          if (extra) lines.push(extra);
          box.innerHTML =
            '<h2 style="margin:0 0 12px;color:#dc2626;">האתר לא נטען כראוי</h2>' +
            '<p>צילום מסך של ההודעה הזו יעזור לאתר את הבעיה:</p>' +
            '<pre style="white-space:pre-wrap;background:#fff;padding:12px;border-radius:8px;font-size:12px;direction:ltr;text-align:left;">' +
            (lines.length ? lines.join('\n').replace(/</g, '&lt;') : 'No errors captured.') +
            '</pre>' +
            '<p style="font-size:12px;color:#555;">User agent: ' + navigator.userAgent.replace(/</g, '&lt;') + '</p>';
          document.body.appendChild(box);
        }

        function withTimeout(promise, ms, label) {
          return Promise.race([
            promise,
            new Promise(function (_, reject) {
              setTimeout(function () {
                reject(new Error(label + ' timed out after ' + ms + 'ms'));
              }, ms);
            }),
          ]);
        }

        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.firstChild) return;

          // Active checks run in parallel: (1) the app's own script tag,
          // to see exactly what came back — status/content-type/body —
          // in case a carrier or network proxy silently rewrote or
          // truncated it rather than producing a normal browser-visible
          // error; (2) the Google Fonts host, on a totally different
          // domain than github.io, as a direct test of "is some other
          // required host actually reachable on this network."
          var appScript = document.querySelector('script[type="module"][src]');
          var src = appScript ? appScript.src : null;

          var scriptCheck = !src
            ? Promise.resolve('No <script type="module"> tag found in the document.')
            : withTimeout(fetch(src, { cache: 'no-store' }), 6000, 'App script fetch')
                .then(function (res) {
                  return res.text().then(function (body) {
                    return (
                      'Fetch of app script (' + src + '): HTTP ' + res.status +
                      ', content-type=' + res.headers.get('content-type') +
                      ', length=' + body.length +
                      ', starts with: ' + JSON.stringify(body.slice(0, 80))
                    );
                  });
                })
                .catch(function (err) {
                  return 'Fetch of app script (' + src + ') failed: ' + err;
                });

          var fontsCheck = withTimeout(
            fetch('https://fonts.googleapis.com/css2?family=Rubik', { mode: 'no-cors', cache: 'no-store' }),
            6000,
            'Fonts host fetch'
          )
            .then(function () {
              return 'fonts.googleapis.com: reachable';
            })
            .catch(function (err) {
              return 'fonts.googleapis.com: UNREACHABLE — ' + err;
            });

          Promise.all([scriptCheck, fontsCheck]).then(function (results) {
            showFallback(results.join('\n'));
          });
        }, 4000);
      })();
    </script>

    <meta name="description" content="הזמנת פיצות בוטיק חמות מהתנור, שתייה קרה וקינוחים אצל שרון. התאמת תוספות לפי משולשים ורבעים." />
    <meta property="og:title" content="הפיצה של שרון | תפריט והזמנות אונליין" />
    <meta property="og:description" content="הזמנת פיצות בוטיק חמות מהתנור, שתייה קרה וקינוחים אצל שרון. התאמת תוספות לפי משולשים ורבעים." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://roei2p.github.io/pizza/assets/hero-pizza-poster-v2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://roei2p.github.io/pizza/assets/hero-pizza-poster-v2.jpg" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />

    <!-- Loaded non-render-blocking: a slow/unreachable font host must
         never stall the rest of the page (or the diagnostic script
         above) from painting. media="print" + onload swap is the
         standard async-CSS trick; the <noscript> covers JS-disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-slate-50 text-slate-800 font-['Rubik',sans-serif] antialiased selection:bg-red-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
